  <body class="portfolio-page">
    <canvas class="portfolio-wireframe" id="portfolio-wireframe" aria-hidden="true"></canvas>
    <div class="home-controls">
      <a class="back-link" href="index.html" data-i18n="nav.home">Home</a>
      <button class="music-toggle" type="button" aria-label="Play music" title="Play music">&gt;</button>
    </div>
    <nav class="top-links" aria-label="Primary pages">
      <a href="life.html" data-i18n="nav.life">Life</a>

      <a href="manifesto.html" data-i18n="nav.manifesto">manifest<i>O</i></a>

      <span class="social-links" aria-label="Social links">
        <a href="https://x.com/mykuelwang" target="_blank" rel="noreferrer">x</a>
        <a href="https://www.linkedin.com/in/mwang0605/" target="_blank" rel="noreferrer">linkedin</a>

        <a href="michael-wang-cv.pdf" target="_blank" rel="noreferrer">cv</a>
      </span>
    </nav>
    <main class="portfolio-main" id="portfolio-root">
      <header class="portfolio-header">
        <p class="portfolio-kicker">selected work / private collection</p>
        <h1>portfolio</h1>
      </header>
      <section class="portfolio-access" id="portfolio-access" aria-label="Unlock portfolio">
        <p class="portfolio-access-note">a closer look at what i’m building.</p>
        <form id="portfolio-form">
          <label for="portfolio-password">password</label>
          <div class="portfolio-password-row">
            <input id="portfolio-password" type="password" autocomplete="current-password" spellcheck="false" required aria-describedby="portfolio-message" />
            <button class="portfolio-action" id="portfolio-unlock" type="submit" disabled>unlock &gt;</button>
          </div>
          <p class="portfolio-message" id="portfolio-message" role="status" aria-live="polite"></p>
        </form>
        <noscript><p class="portfolio-message">Enable JavaScript to unlock this portfolio.</p></noscript>
      </section>
      <section class="portfolio-content" id="portfolio-content" aria-label="Portfolio projects" tabindex="-1" hidden></section>
      <button class="portfolio-action portfolio-lock" id="portfolio-lock" type="button" hidden>lock portfolio &gt;</button>
    </main>
    <p class="portfolio-footer">michael wang <span>/</span> work in progress</p>
    <div class="turntable-fixed" hidden>
      <audio id="player-audio" src="public/assets/butterflies-piano-sonata.mp3" preload="none" playsinline loop></audio>
    </div>
    <script src="portfolio.js?v=1"></script>
    <script src="player.js?v=music-controls"></script>
